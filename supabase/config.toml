[auth]
site_url = "http://localhost:8080"

# Additional redirect URLs allowed for OAuth callbacks.
# Add your production domain here when you deploy.
additional_redirect_urls = [
  "http://localhost:8080/auth/callback",
  "http://localhost:8080/auth/callback/owner",
  "http://localhost:8080/auth/callback/customer",
  "https://style-sessions-pro.vercel.app/auth/callback",
  "https://style-sessions-pro.vercel.app/auth/callback/owner",
  "https://style-sessions-pro.vercel.app/auth/callback/customer",
]

[auth.external.google]
enabled = true
# Set these via environment variables — never hardcode credentials.
# Get them from: https://console.cloud.google.com/ → APIs & Services → Credentials
# Authorised redirect URI to add in GCP: https://<your-project-ref>.supabase.co/auth/v1/callback
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
